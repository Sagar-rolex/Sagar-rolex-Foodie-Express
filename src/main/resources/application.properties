# Uploaded images
food.image.upload-dir=${FOOD_IMAGE_UPLOAD_DIR:uploads/foods}
restaurant.banner.upload-dir=${RESTAURANT_BANNER_UPLOAD_DIR:uploads/restaurants}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB