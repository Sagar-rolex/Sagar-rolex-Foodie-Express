# ─────────────────────────────────────────────────────
#  Foodie Express – Database (MySQL) Configuration
# ─────────────────────────────────────────────────────
# Change these values to match your local MySQL setup.
# Make sure the database exists: CREATE DATABASE foodie_express;

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/foodie_express?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:${MYSQL_USER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQL_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─────────────────────────────────────────────────────
#  Hibernate / JPA
# ─────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─────────────────────────────────────────────────────
#  Application
# ─────────────────────────────────────────────────────
server.port=${PORT:8080}
spring.application.name=foodie-express
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ─────────────────────────────────────────────────────
#  Razorpay Payment Configuration (Test / Live Mode)
# ─────────────────────────────────────────────────────
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}


food.image.upload-dir=${FOOD_IMAGE_UPLOAD_DIR:uploads/foods}
restaurant.banner.upload-dir=${RESTAURANT_BANNER_UPLOAD_DIR:uploads/restaurants}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
