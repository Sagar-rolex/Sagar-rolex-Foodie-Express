# Foodie Express database configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/foodie_express?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Application
server.port=${PORT:8080}
spring.application.name=foodie-express
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Payment credentials come from environment variables
razorpay.key.id=rzp_test_TuakZZMguYX01O
