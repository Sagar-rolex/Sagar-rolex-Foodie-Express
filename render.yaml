services:
  - type: web
    name: foodie-express-api
    runtime: docker
    plan: free
    region: singapore

    dockerfilePath: ./Dockerfile
    dockerContext: .

    healthCheckPath: /api/restaurants

    envVars:
      - key: PORT
        value: "10000"

      - key: DB_URL
        sync: false

      - key: MYSQL_USER
        sync: false

      - key: MYSQL_PASSWORD
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: CORS_ALLOWED_ORIGINS
        sync: false

      - key: RAZORPAY_KEY_ID
        sync: false

      - key: RAZORPAY_KEY_SECRET
        sync: false
